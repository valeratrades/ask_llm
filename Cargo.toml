cargo-features = ["codegen-backend"]
[package]
name = "ask_llm"
version = "3.6.2"
license = "MIT"
description = "make a request to whatever llm is the best these days, without hardcoding model/provider"
documentation = "https://github.com/valeratrades/ask_llm/tree/master/README.md"
homepage = "https://github.com/valeratrades/ask_llm"
repository = "https://github.com/valeratrades/ask_llm"
edition = "2024"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md", ".cargo/*", "build.rs"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[[bin]]
name = "ask_llm"
path = "./src/main.rs"
required-features = ["cli"]
#,}}}

[features]
cli = ["dep:clap", "v_utils/cli"]

default = ["cli"]
full = ["cli"]

[dependencies]
base64 = "0.22"
clap = { version = "^4.6.1", features = ["derive"], optional = true }
color-eyre = "^0.6.5"
derive_more = { version = "2.1.1", features = ["from", "display", "deref", "deref_mut", "debug", "from_str"] }
eyre = "0.6.12"
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter", "serde"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.24.0"
thiserror = "2.0.19"
tokio = { version = "1.52.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-error = "0.2"
v_utils = { version = "^2.19.3" }

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
result_large_err = "allow" # every fallible path is a network or subprocess round trip; the backtrace+spantrace an error carries is noise next to it, and boxing would break matching through `Failure`

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"

[lints.rust]
unused_features = "allow"

[[example]]
name = "async"
path = "examples/async.rs"

[[example]]
name = "codeblocks"
path = "examples/codeblocks.rs"

[[example]]
name = "force_json"
path = "examples/force_json.rs"

[[example]]
name = "file_attachment"
path = "examples/file_attachment.rs"

[[example]]
name = "translate"
path = "examples/translate.rs"

[[example]]
name = "watch"
path = "examples/watch.rs"
